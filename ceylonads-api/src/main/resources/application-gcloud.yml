spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://db.kntyviiqnqrncmdwrmlc.supabase.co:5432/postgres?options=-c%20statement_timeout=0}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Alipera@123}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Schema already present before Flyway adoption"

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

logging:
  level:
#    org.hibernate.SQL: INFO
    org.hibernate.SQL: DEBUG

ceylonads:
  cors:
    allowed-origins: http://localhost:*
  media:
    gcs:
      bucket: ${GCS_BUCKET:ceylonads-test}
      public-base-url: ${GCS_PUBLIC_BASE_URL:https://storage.googleapis.com/ceylonads-test}
    root: ./data/media
    public-prefix: /media

  jwt:
    secret-base64: ${JWT_SECRET_BASE64:Y2V5bG9uYWRzLWRldi1vbmx5LXNlY3JldC1rZXktMzItYnl0ZXMtbG9uZw==}
