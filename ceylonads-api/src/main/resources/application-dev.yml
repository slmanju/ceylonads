spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ceylonads_dev
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Schema already present before Flyway adoption"

  # sql:
  #   init:
  #     mode: always
  #     data-locations:
  #       - classpath:sample-data/accounts.sql
  #       - classpath:sample-data/ads.sql
  #       - classpath:sample-data/promotions.sql
  #     continue-on-error: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

logging:
  level:
    org.hibernate.SQL: DEBUG

ceylonads:
  cors:
    allowed-origins: http://localhost:*

  media:
    s3:
      bucket: ${S3_BUCKET:ceylonads-dev-media-667500583075}
      public-base-url: ${S3_PUBLIC_BASE_URL:https://ceylonads-dev-media-667500583075.s3.ap-south-1.amazonaws.com}
      region: ${AWS_REGION:ap-south-1}

  jwt:
    secret-base64: ${JWT_SECRET_BASE64:Y2V5bG9uYWRzLWRldi1vbmx5LXNlY3JldC1rZXktMzItYnl0ZXMtbG9uZw==}
