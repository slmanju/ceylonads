spring:
  datasource:
    url: jdbc:h2:mem:schemagen
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

      jakarta.persistence.schema-generation.scripts.action: create
      jakarta.persistence.schema-generation.scripts.create-target: build/schema-postgres.sql
      jakarta.persistence.schema-generation.create-source: metadata

ceylonads:
  cors:
    allowed-origins: http://localhost:*
  media:
    root: ./data/media
    public-prefix: /media
  jwt:
    # Development-only signing secret. Never use this value outside local development.
    secret-base64: ${JWT_SECRET_BASE64:Y2V5bG9uYWRzLWRldi1vbmx5LXNlY3JldC1rZXktMzItYnl0ZXMtbG9uZw==}

